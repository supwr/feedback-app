# Local environment for LocalStack
quarkus.profile=local

# AWS SDK local endpoint
aws.region=${AWS_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:test}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}

# LocalStack endpoints for AWS services
quarkus.dynamodb.endpoint-override=http://localhost:4566
quarkus.sqs.endpoint-override=http://localhost:4566

# Application resources
feedback.table.name=${FEEDBACK_TABLE_NAME:feedbacks}
feedback.report.queue.name=${FEEDBACK_REPORT_QUEUE_NAME:report-queue}
