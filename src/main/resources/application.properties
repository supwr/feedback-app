
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.host=${QUARKUS_HTTP_HOST:0.0.0.0}
app.localstack.enabled=false

# AWS - DynamoDB
quarkus.dynamodb.aws.region=${AWS_REGION:us-east-2}
quarkus.dynamodb.aws.credentials.type=default

# AWS - SQS
quarkus.sqs.aws.region=${AWS_REGION:us-east-2}
quarkus.sqs.aws.credentials.type=default

# DynamoDB
feedback.table.name=${FEEDBACK_TABLE_NAME:feedbacks}

# SQS
feedback.report.queue.name=${FEEDBACK_REPORT_QUEUE_NAME:feedback-events}
feedback.notification.queue.name=${FEEDBACK_NOTIFICATION_QUEUE_NAME:notification-queue}
