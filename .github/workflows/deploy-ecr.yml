
name: Deploy Quarkus Native to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: feedback-app

jobs:
  deploy:
    name: Build Native and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::432073638094:role/GitHubActionsECRPushPolicy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Quarkus Native
        run: |
          ./mvnw clean package \
            -DskipTests \
            -Dquarkus.profile=prod \
            -Dquarkus.native.enabled=true \
            -Dquarkus.native.container-build=true

      - name: Verify native executable
        run: |
          echo "Target contents:"
          ls -lah target/

          echo "Searching for native executable:"
          find target -maxdepth 1 -type f -name "*-runner" -ls

          if ! find target -maxdepth 1 -type f -name "*-runner" | grep -q .; then
            echo "ERROR: Native executable not found!"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f src/main/docker/Dockerfile.native \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            --push \
            .
