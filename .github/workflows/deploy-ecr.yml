  ```yaml
  name: Deploy Quarkus Native to ECR

  on:
    push:
      branches:
        - main

  permissions:
    id-token: write
    contents: read

  env:
    AWS_REGION: us-east-1
    ECR_REPOSITORY: feedback-app

  jobs:
    deploy:
      name: Build Native and Push to ECR
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up JDK
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6
          with:
            role-to-assume: arn:aws:iam::432073638094:role/GitHubActionsECRPushPolicy
            aws-region: ${{ env.AWS_REGION }}

        - name: Verify AWS identity
          run: aws sts get-caller-identity

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Build Quarkus Native
          run: |
            ./mvnw package \
              -Dnative \
              -Dquarkus.native.container-build=true \
              -DskipTests

        - name: Verify native executable
          run: |
            echo "Target directory:"
            ls -lah target/
            
            echo "Native executable:"
            find target -maxdepth 1 -type f -name "*-runner" -ls
            
            if ! find target -maxdepth 1 -type f -name "*-runner" | grep -q .; then
              echo "ERROR: Native executable not found!"
              exit 1
            fi

        - name: Debug Docker context
          run: |
            echo "Working directory:"
            pwd
            
            echo "Dockerfile:"
            ls -lah src/main/docker/Dockerfile.native
            
            echo "Target:"
            ls -lah target/
            
            echo "Docker ignore:"
            cat .dockerignore || true
            
            echo "Native executable:"
            find target -maxdepth 1 -type f -name "*-runner" -ls

        - name: Build Docker image
          run: |
            docker build \
              --no-cache \
              -f src/main/docker/Dockerfile.native \
              -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
              -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
              .

        - name: Push Docker image
          run: |
            docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
    ```