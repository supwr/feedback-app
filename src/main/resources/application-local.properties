# LocalStack Dev Services
app.localstack.enabled=true
quarkus.aws.devservices.provider=localstack
quarkus.aws.devservices.localstack.image-name=localstack/localstack:4.13

# Use the LocalStack credentials expected by the dev-service-generated AWS clients
aws.region=${AWS_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:test}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:test}

quarkus.dynamodb.aws.region=us-east-1
quarkus.dynamodb.aws.credentials.type=static
quarkus.dynamodb.aws.credentials.static-provider.access-key-id=test
quarkus.dynamodb.aws.credentials.static-provider.secret-access-key=test

quarkus.sqs.aws.region=us-east-1
quarkus.sqs.aws.credentials.type=static
quarkus.sqs.aws.credentials.static-provider.access-key-id=test
quarkus.sqs.aws.credentials.static-provider.secret-access-key=test

# Application
feedback.table.name=feedbacks
feedback.report.queue.name=feedback-events
feedback.notification.queue.name=notification-queue
