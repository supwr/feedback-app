
name: Deploy Quarkus Native to ECR

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: feedback-app

jobs:
  deploy:
    name: Build Native and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::432073638094:role/GitHubActionsECRPushPolicy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Quarkus Native
        run: |
          set -euxo pipefail

          ./mvnw clean package \
            -Plambda \
            -DskipTests \
            -Dquarkus.profile=prod \
            -Dquarkus.native.enabled=true \
            -Dquarkus.native.container-build=true 

          echo "Checking native executable..."
          ls -lh target/*-runner
          file target/*-runner
          test -x target/api-1.0.0-SNAPSHOT-runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        run: |
          set -euxo pipefail

          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f src/main/docker/Dockerfile.native \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            --push \
            .

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name feedback-api \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
      
          aws lambda wait function-updated-v2 \
            --function-name feedback-api
